[plugin]
enabled = true
config_version = "1.0.0"

[rhythm]
enabled = true
max_chars = 24
min_chars = 2
skip_patterns = "你没有权限使用此命令\n已清空.*Maisaka 历史上下文\n我暂时失忆了\n^/"

[system_text]
enabled = true
patterns = "^我暂时失忆了$\n^已清空.*Maisaka 历史上下文"

[learn]
enabled = true
vary_marks = "# A 白名单形态：风格描述里出现这些「可变特征」→ 允许入库\n用\n直接\n换\n每次\n可以\n先\n再\n按\n提出\n回应\n接梗\n复述\n引用\n堆叠\n反问\n换个说法\n说法\n几种\n多个\nX\nN\n…"
guard_patterns = "# 守卫 1：固定尾缀 / 行为模板（虽含方向词，输出仍是固定的一句）\n句尾加|结尾加|都以.*结尾\n先复述对方|复述对方原句|复述对方原话\n# 守卫 2：确认过的标志词（黑名单降级为补充，只留 0 误伤的）\n属于是\n投名状|了却|何妨|承让|讨教\n# 守卫 3：纯引号原话\n^[\"“].{0,18}[\"”]$"

[inject]
enabled = true
marker = "[这一轮怎么说话]"
template = "[这一轮怎么说话]\n像在微信上随手打字，不像写文章、不像台词。\n\n· 短。一两句就够，别铺开。\n· 大白话。把要说的事直接说出来，别绕着说。\n· 别照抄参考：\n  【回复信息参考】只是告诉你要说什么事，不是让你抄句子。\n  换成你自己的说法再开口，别沿用里面的词和句式。\n· 别跟着入戏：群里有人在演、在编段子、在写剧本时，\n  你还是用平时说话的方式接，不要跟着换成戏里的腔调。\n· 总判据：把这句话念一遍——\n  像【电视剧台词 / 作文】就改写；像【微信里随手打的】才对。\n\n[别用这些词]\n{words}"
words = "投名状\n江湖\n恩怨\n交手\n了却\n何妨\n承让\n讨教\n搁浅\n怎么看都像\n与其说\n竟有种\n不免\n反倒\n谈不上\n这波\n那波\n就下\n出息\n就这点\n好歹\n让人\n倒是\n倒也\n倒挺\n这茬\n回头\n念叨\n非…不可\n…归…\n说到底\n终究\n说定了\n门朝哪开\n可不一定\n我认了\n我服了\n我输了\n你赢了\n我说不过你\n有道理\n说得对"
log_every = false
planner_marker = "[指引写法]"
planner_template = "[指引写法]\n你要给后面的模型写「这一轮该怎么回」的方向，不是写台词。\n\n格式：【对象】＋【点】｜【回复方向】｜【语气】\n\n【回复方向】只能选一个：\n接话 / 接梗 / 给结论 / 平淡接 / 拒绝 / 不接 / 撩\n\n【点】要具体：某个词、某个细节，不超过 6 个字。\n【语气】用一两个词：随口 / 嘴硬 / 平淡 / 好奇\n\n写指引时：\n· 只写方向和点，别写成一整句打磨过的台词。\n  错：「图里那只趴着不动，怎么看都不像可爱」← 这是台词\n  对：「拆台｜平淡接｜随口」← 这是方向\n· 别用书面语和文学腔（投名状、江湖、了却、怎么看都像、与其说）。\n· 场景再「戏」也让台词说人话——像在宿舍里随口聊天。\n\n示例（只示范格式，内容别照抄）：\n✓ 【对象】A｜【点】某个词｜【回复方向】玩笑接｜【语气】随口\n✓ 【对象】B｜【点】某个细节｜【回复方向】撩｜【语气】嘴硬"

